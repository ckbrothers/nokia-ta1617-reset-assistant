name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol and reset protection checks (no device access)
        shell: powershell
        run: .\tests\offline-tests.ps1
      - name: Chinese GUI state checks (no device access)
        shell: powershell
        run: .\gui.ps1 -UiCheck
